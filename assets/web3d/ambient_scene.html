<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const PRIMARY_BLUE = 0x1f6aa5;
    const LIGHT_BLUE = 0x4e88bc;

    const icoGeometry = new THREE.IcosahedronGeometry(2.4, 1);
    const icoMaterial = new THREE.MeshBasicMaterial({
      color: PRIMARY_BLUE,
      wireframe: true,
      transparent: true,
      opacity: 0.42,
    });
    const icosahedron = new THREE.Mesh(icoGeometry, icoMaterial);
    scene.add(icosahedron);

    const innerGeometry = new THREE.IcosahedronGeometry(1.3, 0);
    const innerMaterial = new THREE.MeshBasicMaterial({
      color: LIGHT_BLUE,
      wireframe: true,
      transparent: true,
      opacity: 0.3,
    });
    const innerIcosahedron = new THREE.Mesh(innerGeometry, innerMaterial);
    scene.add(innerIcosahedron);

    const particleCount = 220;
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 16;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 16;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 10 - 2;
    }
    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(positions, 3)
    );
    const particleMaterial = new THREE.PointsMaterial({
      color: LIGHT_BLUE,
      size: 0.05,
      transparent: true,
      opacity: 0.6,
    });
    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      icosahedron.rotation.x = t * 0.15;
      icosahedron.rotation.y = t * 0.22;
      innerIcosahedron.rotation.x = -t * 0.18;
      innerIcosahedron.rotation.y = -t * 0.12;
      particles.rotation.y = t * 0.02;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
